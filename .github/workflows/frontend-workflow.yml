name: Frontend CI - Build and Push to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  publish_images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build image
        run: docker build frontend -t ${{ secrets.DOCKER_USERNAME }}/student-frontend:latest

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/student-frontend:latest